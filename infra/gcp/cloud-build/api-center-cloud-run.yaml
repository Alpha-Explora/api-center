substitutions:
  _PROJECT_ID: apicenter-alpha-20260623
  _REGION: asia-southeast1
  _IMAGE: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/api-center:cloud-run-staging
  _MANIFEST: infra/gcp/cloud-run/api-center.staging.yaml

steps:
  - name: node:24-bookworm-slim
    id: test
    entrypoint: sh
    args:
      - -c
      - |
        npm ci
        npm run db:generate
        npm run typecheck
        ALLOW_MISSING_EXTERNAL_MANIFESTS=true npm test

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - docker/Dockerfile.gcp
      - .
    waitFor: [test]

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_IMAGE}
    waitFor: [build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - replace
      - ${_MANIFEST}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
    waitFor: [push]

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
