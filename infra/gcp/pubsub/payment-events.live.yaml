apiVersion: apicenter.itsandbox.site/v1
kind: PaymentEventDeliveryPlan
metadata:
  name: apicenter.payment-events.live
spec:
  projectId: ${APICENTER_GCP_PROJECT_ID}
  environment: live
  topic:
    name: apicenter.payment-events.live
    messageRetentionDuration: 31d
  deadLetter:
    topicName: apicenter.payment-events.live.dead-letter
    subscriptionName: apicenter.payment-events.live.dead-letter.subscription
    messageRetentionDuration: 31d
  delivery:
    maxDeliveryAttempts: 20
    ackDeadlineSeconds: 30
    serviceAccountEmail: apicenter-payment-events-delivery@${APICENTER_GCP_PROJECT_ID}.iam.gserviceaccount.com
  consumers:
    - consumerServiceId: alphaci-backend
      pushEndpoint: ${ALPHACI_PAYMENT_EVENTS_LIVE_ENDPOINT}
      filter: attributes.consumerServiceId = "alphaci-backend"
      oidcAudience: ${ALPHACI_PAYMENT_EVENTS_LIVE_ENDPOINT}
  monitoring:
    alertPolicyName: apicenter.payment-events.live.delivery-failures
    condition: dead_letter_delivery_or_unacked_messages
  iam:
    invokerRole: roles/run.invoker
    scope: registered_consumer_endpoint