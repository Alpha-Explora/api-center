apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gauth
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/service-account: apicenter-shared-services-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: apicenter-shared-services-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/apicenter-gauth:cloud-run
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-google-client-id-prod
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-google-client-secret-prod
                  key: latest
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-google-redirect-uri-prod
                  key: latest
            - name: GOOGLE_OAUTH_TENANT_CLIENTS_JSON
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-google-tenant-clients-prod
                  key: latest
            - name: GAUTH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-gauth-admin-token
                  key: latest

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apicenter-gauth-database-url-live
                  key: latest
            - name: NODE_ENV
              value: production
            - name: GOOGLE_CLOUD_PROJECT
              value: apicenter-alpha-20260623
            - name: GAUTH_AUTHORIZE_LIMIT_PER_SUBJECT
              value: "20"
            - name: GAUTH_AUTHORIZE_LIMIT_WINDOW_MS
              value: "60000"
            - name: GAUTH_PROVIDER_TIMEOUT_MS
              value: "2000"
            - name: GAUTH_PROVIDER_FAILURE_THRESHOLD
              value: "5"
            - name: GAUTH_PROVIDER_CIRCUIT_RESET_MS
              value: "30000"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 15
