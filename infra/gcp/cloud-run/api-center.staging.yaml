apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-center-staging
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/service-account: api-center-cloud-run@apicenter-alpha-20260623.iam.gserviceaccount.com
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: api-center-cloud-run@apicenter-alpha-20260623.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/api-center:cloud-run-staging
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: GCP_PROJECT_ID
              value: apicenter-alpha-20260623
            - name: GCP_SECRET_NAME
              value: api-center-prod
            - name: AUTH_PROVIDER
              value: composite
            - name: ALLOWED_ORIGINS
              value: https://api-center-management-test.itsandbox.site
            - name: REDIS_CACHE_URL
              value: redis://10.121.26.59:6379
            - name: REDIS_RATE_LIMIT_URL
              value: redis://10.121.26.59:6379
            - name: DATA_PIPELINE_ENABLED
              value: "false"
            - name: KAFKA_ENABLED
              value: "false"
            - name: SHARED_SERVICE_PUBSUB_ENABLED
              value: "true"
            - name: APICENTER_SHARED_SERVICE_EVENTS_TOPIC_TEST
              value: apicenter.shared-service-events.test
            - name: PAYMENT_PUBSUB_IAM_ENABLED
              value: "true"
            - name: CLOUD_RUN_AUTH_ENABLED
              value: "true"
            - name: SHARED_SERVICE_ROUTE_PAYMENT_TEST
              value: https://apicenter-payments-test-mvrs6gmtgq-as.a.run.app
            - name: SHARED_SERVICE_ROUTE_PAYMENT_LIVE
              value: https://apicenter-payments-live-mvrs6gmtgq-as.a.run.app
            - name: APICENTER_PAYMENTS_INTERNAL_TOKEN_TEST
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-test-internal-token
                  key: latest
            - name: APICENTER_PAYMENTS_INTERNAL_TOKEN_LIVE
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-live-internal-token
                  key: latest
            - name: PAYMONGO_TEST_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-test-webhook-secret
                  key: latest
            - name: PAYMONGO_LIVE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-live-webhook-secret
                  key: latest
            - name: GAUTH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-gauth-admin-token
                  key: latest
            - name: EMAIL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-email-admin-token
                  key: latest
            - name: RESEND_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-resend-webhook-secret-prod
                  key: latest
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-twilio-auth-token-prod
                  key: latest
            - name: TWILIO_STATUS_CALLBACK_URL
              value: https://api-center.itsandbox.site/api/v1/webhooks/twilio
            - name: APICENTER_RUNTIME_TARGET
              value: cloud-run-staging
            - name: APICENTER_SHARED_SERVICE_EVENTS_TOPIC_LIVE
              value: apicenter.shared-service-events.live
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
            timeoutSeconds: 5
            periodSeconds: 15
