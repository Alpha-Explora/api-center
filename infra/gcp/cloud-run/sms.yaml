apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sms
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/service-account: apicenter-shared-services-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: apicenter-shared-services-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/apicenter-sms:cloud-run
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apicenter-sms-database-url-live
                  key: latest
            - name: NODE_ENV
              value: production
            - name: SMS_REDIS_URL
              value: redis://10.121.26.59:6379
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-twilio-account-sid-prod
                  key: latest
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-twilio-auth-token-prod
                  key: latest
            - name: TWILIO_MESSAGING_SERVICE_SID
              valueFrom:
                secretKeyRef:
                  name: apicenter-shared-twilio-messaging-service-sid-prod
                  key: latest
            - name: SMS_SEND_LIMIT_PER_RECIPIENT
              value: "10"
            - name: SMS_SEND_LIMIT_WINDOW_MS
              value: "60000"
            - name: SMS_IDEMPOTENCY_TTL_MS
              value: "604800000"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 15
