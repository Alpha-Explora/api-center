apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: apicenter-payments-live
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/maxScale: "2"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/service-account: apicenter-payments-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: apicenter-payments-runtime@apicenter-alpha-20260623.iam.gserviceaccount.com
      containers:
        - image: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/apicenter-payments:cloud-run-live
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: GCP_PROJECT_ID
              value: apicenter-alpha-20260623
            - name: PAYMENT_PROVIDER_MODE
              value: live
            - name: PAYMENT_PROVIDER_NAME
              value: paymongo
            - name: PAYMENT_SUBSCRIPTIONS_ENABLED
              value: "true"
            - name: SHARED_SERVICES_DATABASE_ENABLED
              value: "true"
            - name: SHARED_SERVICES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-database-url-live
                  key: latest
            - name: PAYMONGO_LIVE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-live-secret-key
                  key: latest
            - name: PAYMONGO_LIVE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-live-webhook-secret
                  key: latest
            - name: APICENTER_PAYMENTS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apicenter-payments-live-internal-token
                  key: latest
            - name: PUBSUB_DISPATCHER_ENABLED
              value: "true"
            - name: APICENTER_PAYMENT_EVENTS_TOPIC_TEST
              value: apicenter.payment-events.test
            - name: APICENTER_PAYMENT_EVENTS_TOPIC_LIVE
              value: apicenter.payment-events.live
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
            timeoutSeconds: 5
            periodSeconds: 15

