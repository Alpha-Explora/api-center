# =============================================================================
# 10-serviceaccount.yaml — Workload Identity KSA for api-center
# =============================================================================
# This Kubernetes ServiceAccount is bound to the GCP service account
#   api-center-gke@apicenter-alpha-20260623.iam.gserviceaccount.com
# via Workload Identity. The pod runs as this KSA so the secrets.service.ts
# can call Secret Manager without any JSON keys.
#
# Provision (one-time):
#   gcloud iam service-accounts create api-center-gke
#   gcloud projects add-iam-policy-binding apicenter-alpha-20260623 \
#     --member="serviceAccount:api-center-gke@apicenter-alpha-20260623.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#   gcloud iam service-accounts add-iam-policy-binding \
#     api-center-gke@apicenter-alpha-20260623.iam.gserviceaccount.com \
#     --role="roles/iam.workloadIdentityUser" \
#     --member="serviceAccount:apicenter-alpha-20260623.svc.id.goog[api-center/api-center]"
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-center
  namespace: api-center
  annotations:
    iam.gke.io/gcp-service-account: api-center-gke@apicenter-alpha-20260623.iam.gserviceaccount.com


