resources:
  - 00-namespace.yaml
  - ../10-serviceaccount.yaml
  - ../20-configmap.yaml
  - ../30-deployment.yaml
  - ../40-service.yaml
  - ../41-backendconfig.yaml
  - ../50-hpa.yaml
  - ../60-pdb.yaml
  - ../70-managedcert.yaml
  - ../80-ingress.yaml

namespace: api-center-test

patches:
  - target:
      kind: ConfigMap
      name: api-center-config
    path: patches/configmap.yaml
  - target:
      kind: Deployment
      name: api-center
    path: patches/deployment.yaml
