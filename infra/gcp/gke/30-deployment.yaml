# =============================================================================
# 30-deployment.yaml — api-center gateway Deployment
# =============================================================================
# Stateless NestJS gateway. Designed to be horizontally scaled by the HPA in
# 50-hpa.yaml — `replicas` here is just the initial count; the HPA owns it
# after the first reconcile.
#
# Replace before applying:
#   asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/api-center:prod-20260418151800   Artifact Registry image, e.g.
#             asia-southeast1-docker.pkg.dev/<PROJECT>/api-center/api-center:v1.2.3
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-center
  namespace: api-center
  labels:
    app.kubernetes.io/name: api-center
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-center
    spec:
      serviceAccountName: api-center
      # NestJS enableShutdownHooks() needs time to drain in-flight requests.
      # Dockerfile already wraps node in dumb-init so SIGTERM is forwarded.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread pods across zones when HPA scales above one replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-center
      containers:
        - name: api-center
          image: asia-southeast1-docker.pkg.dev/apicenter-alpha-20260623/api-center/api-center:migration-5271227-20260623
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-center-config
          # CRITICAL: HPA computes utilization against `requests`, NOT `limits`.
          # Keep these in sync with cloudrun.yaml so behavior is comparable.
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup probe — give the app time to load secrets from Secret Manager
          # before liveness starts killing it.
          startupProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          # Liveness — restart only on hard failure
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness — fails FAST when overloaded so GCLB stops sending traffic
          # while HPA spins up new pods. Do not relax these numbers.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # NestJS writes to ./logs at runtime
            capabilities:
              drop: ["ALL"]
          # Give the kubelet a moment to remove the pod from Service endpoints
          # before SIGTERM. Avoids the brief 502 window during rollouts.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]


