# =============================================================================
# deploy/local/docker-compose.yml — APICenter Infrastructure Stack
# =============================================================================

x-api-center-common: &api-center-common
  image: apicenter-gateway:local
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runner
  env_file:
    - ../../.env
  environment:
    GATEWAY_ROLE: apicenter-gateway
    VAULT_ADDR:     http://vault:8200
    VAULT_TOKEN:    root
    VAULT_DEV_MODE: "true"
    JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
    JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-100}"
    SHARED_SERVICE_ROUTE_EMAIL_TEST: http://email-service:4012
    SHARED_SERVICE_ROUTE_EMAIL_LIVE: http://email-service:4012
    SHARED_SERVICE_ROUTE_SMS_TEST: http://sms-service:4011
    SHARED_SERVICE_ROUTE_SMS_LIVE: http://sms-service:4011
    SHARED_SERVICE_ROUTE_OTP_TEST: http://otp-service:4014
    SHARED_SERVICE_ROUTE_OTP_LIVE: http://otp-service:4014
    SHARED_SERVICE_ROUTE_GAUTH_TEST: http://gauth-service:4013
    SHARED_SERVICE_ROUTE_GAUTH_LIVE: http://gauth-service:4013
    SHARED_SERVICE_ROUTE_GEO_TEST: http://geo-service:4015
    SHARED_SERVICE_ROUTE_GEO_LIVE: http://geo-service:4015
  depends_on:
    vault:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
           "http://localhost:3000/api/v1/health/live"]
    interval: 15s
    timeout:  5s
    retries:  3
    start_period: 30s
  restart: unless-stopped
  networks:
    - api-center-network

services:
  email-service:
    build:
      context: ../..
      dockerfile: Dockerfile.shared-service
      args:
        SERVICE: email
    environment:
      PORT: "4012"
      NODE_ENV: development
      REGISTER_WITH_GATEWAY: "false"
    expose: ["4012"]
    networks: [api-center-network]

  sms-service:
    build:
      context: ../..
      dockerfile: Dockerfile.shared-service
      args:
        SERVICE: sms
    environment:
      PORT: "4011"
      NODE_ENV: development
      REGISTER_WITH_GATEWAY: "false"
    expose: ["4011"]
    networks: [api-center-network]

  otp-service:
    build:
      context: ../..
      dockerfile: Dockerfile.shared-service
      args:
        SERVICE: otp
    environment:
      PORT: "4014"
      NODE_ENV: development
      REGISTER_WITH_GATEWAY: "false"
    expose: ["4014"]
    networks: [api-center-network]

  gauth-service:
    build:
      context: ../..
      dockerfile: Dockerfile.shared-service
      args:
        SERVICE: gauth
    environment:
      PORT: "4013"
      NODE_ENV: development
      REGISTER_WITH_GATEWAY: "false"
    expose: ["4013"]
    networks: [api-center-network]

  geo-service:
    build:
      context: ../..
      dockerfile: Dockerfile.shared-service
      args:
        SERVICE: geo
    environment:
      PORT: "4015"
      NODE_ENV: development
      REGISTER_WITH_GATEWAY: "false"
    expose: ["4015"]
    networks: [api-center-network]

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-center-1:
        condition: service_healthy
      api-center-2:
        condition: service_healthy
      api-center-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout:  5s
      retries:  3
    restart: unless-stopped
    networks:
      - api-center-network

  api-center-1:
    <<: *api-center-common
    container_name: api-center-1

  api-center-2:
    <<: *api-center-common
    container_name: api-center-2

  api-center-3:
    <<: *api-center-common
    container_name: api-center-3

  logistics-service:
    build:
      context: ../../examples/sandbox
      dockerfile: logistics-service/Dockerfile
    container_name: logistics-service
    environment:
      PORT: "4000"
      JWKS_URL: http://nginx/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: api-center-dev
    expose:
      - "4000"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      api-center-network:
        aliases:
          - logistics-service.local

  demand-service:
    build:
      context: ../../examples/sandbox
      dockerfile: demand-service/Dockerfile
    container_name: demand-service
    environment:
      PORT: "4100"
      APICENTER_URL: http://nginx
      DEMAND_TRIBE_ID: demand-service
      DEMAND_TRIBE_SECRET: "${DEMAND_TRIBE_SECRET:-sandbox-change-me}"
    ports:
      - "4100:4100"
    depends_on:
      nginx:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      api-center-network:
        aliases:
          - demand-service.local

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID:  root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: warn
    cap_add:
      - IPC_LOCK
    command: vault server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout:  5s
      retries:  3
      start_period: 5s
    networks:
      - api-center-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - api-center-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-local-change-in-prod}"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - api-center-network

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - api-center-network

networks:
  api-center-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
    driver: local
