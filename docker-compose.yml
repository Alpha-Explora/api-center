# =============================================================================
# docker-compose.yml — APICenter Complete Infrastructure Stack
# =============================================================================
#
# ARCHITECTURE DIAGRAM (checklist §1–§4, §8):
#
#   ┌──────────────────────────────────────────────────────────────────┐
#   │  Consumer  (tribe SDK / browser / external client)               │
#   └───────────────────────────┬──────────────────────────────────────┘
#                               │ HTTP  :3000  ← ONE entrypoint
#   ┌───────────────────────────▼──────────────────────────────────────┐
#   │  NGINX  (load balancer)                                          │
#   │  • Round-robin across 3 containers          (checklist §3)       │
#   │  • Passive health checks — auto remove/re-add containers         │
#   │  • CORS preflight answered at NGINX level                        │
#   │  • Connection-level rate limiting before Node                    │
#   └────────┬──────────────────┬──────────────────┬───────────────────┘
#            │                  │                  │
#   ┌────────▼──────┐  ┌────────▼──────┐  ┌────────▼──────┐
#   │ api-center-1  │  │ api-center-2  │  │ api-center-3  │
#   │ (this image)  │  │ (same image)  │  │ (same image)  │
#   │  stateless    │  │  stateless    │  │  stateless    │
#   └───────────────┘  └───────────────┘  └───────────────┘
#        All 3 are IDENTICAL and INTERCHANGEABLE (checklist §2)
#        Stopping any one does NOT interrupt traffic (checklist §8)
#
#   Shared infrastructure (all containers connect to the same instances):
#   ┌─────────────────────────────────────────────────────────────────┐
#   │  redis-cache      :6381  — service registry + token store       │
#   │  redis-rate-limit :6380  — distributed rate-limit counters      │
#   │  vault            :8200  — secrets + Transit signing (dev mode) │
#   └─────────────────────────────────────────────────────────────────┘
#
#   Observability:
#   ┌─────────────────────────────────────────────────────────────────┐
#   │  prometheus   :9090  — metrics scraping                         │
#   │  grafana      :3001  — dashboards                               │
#   │  jaeger       :16686 — distributed tracing UI                   │
#   └─────────────────────────────────────────────────────────────────┘
#
# HOW TO RUN:
#   docker-compose up -d
#
# HOW TO ADD A 4th CONTAINER (checklist §8 — horizontal scaling):
#   1. Add to this file (copy api-center-3 block, rename to api-center-4)
#   2. Add  server api-center-4:3000 max_fails=3 fail_timeout=20s;
#      to the upstream block in nginx.conf
#   3. docker-compose up -d api-center-4 && docker-compose restart nginx
#
# TRIBE SDK (checklist §5, §6, §7):
#   Tribes interact with this stack via the shared SDK only.
#   See the api-shared-services repository and @apicenter/sdk package.
#   SDK gateway URL in development: http://localhost:3000
# =============================================================================

# Note: The `version` attribute is obsolete in modern Docker Compose and has been removed.

# =============================================================================
# Shared anchor for all 3 identical gateway containers (checklist §2)
# Every change here is automatically applied to all 3 containers.
# =============================================================================
x-api-center-common: &api-center-common
  image: apicenter-gateway:local
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  env_file:
    - .env
  environment:
    # All 3 containers get the same env — stateless by design
    GATEWAY_ROLE: apicenter-gateway
    # Redis URLs point to container names (Docker internal network)
    REDIS_CACHE_URL:      redis://redis-cache:6379
    REDIS_RATE_LIMIT_URL: redis://redis-rate-limit:6379
    # Local sandbox allowlists — wildcard allows all registered tribes
    # Vault dev server — replace with AppRole credentials in production
    VAULT_ADDR:     http://vault:8200
    VAULT_TOKEN:    root
    VAULT_DEV_MODE: "true"
    JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
    JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    # Sandbox tribe credentials — set in .env (sha256 of your local secret)
    # Generate: printf '%s' 'your-secret' | sha256sum
    TRIBE_SECRET_DEMAND_SERVICE: "${TRIBE_SECRET_DEMAND_SERVICE}"
    TRIBE_SECRET_LOGISTICS_SERVICE: "${TRIBE_SECRET_LOGISTICS_SERVICE}"
    # Use .env RATE_LIMIT_MAX (default 100) so round-robin tests are not
    # artificially throttled by a hard-coded sandbox override.
    RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-100}"
  depends_on:
    redis-cache:
      condition: service_healthy
    redis-rate-limit:
      condition: service_healthy
    vault:
      condition: service_healthy
  healthcheck:
    # NGINX passive health check reads this endpoint to decide rotation status
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
           "http://localhost:3000/api/v1/health/live"]
    interval: 15s
    timeout:  5s
    retries:  3
    start_period: 30s
  restart: unless-stopped
  networks:
    - api-center-network

# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # NGINX — Single entrypoint + round-robin load balancer  (checklist §3)
  # ---------------------------------------------------------------------------
  # ALL consumer traffic enters here first.
  # NGINX is responsible for:
  #   • Distributing traffic round-robin across the 3 gateway containers
  #   • Removing unhealthy containers from rotation (passive health checks)
  #   • Re-adding recovered containers automatically (fail_timeout)
  #   • Answering CORS preflight (OPTIONS) without hitting Node
  #   • Connection-level rate limiting
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    ports:
      - "3000:80"      # ← THE ONE entrypoint. Tribes/browsers use this port.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-center-1:
        condition: service_healthy
      api-center-2:
        condition: service_healthy
      api-center-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout:  5s
      retries:  3
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # APICenter Gateway — Container 1  (checklist §2)
  # ---------------------------------------------------------------------------
  # Identical to containers 2 and 3. Runs the same image.
  # Stopping this container does NOT interrupt traffic —
  # NGINX will route to containers 2 and 3 automatically.
  # ---------------------------------------------------------------------------
  api-center-1:
    <<: *api-center-common
    container_name: api-center-1

  # ---------------------------------------------------------------------------
  # APICenter Gateway — Container 2  (checklist §2)
  # ---------------------------------------------------------------------------
  api-center-2:
    <<: *api-center-common
    container_name: api-center-2

  # ---------------------------------------------------------------------------
  # APICenter Gateway — Container 3  (checklist §2)
  # ---------------------------------------------------------------------------
  api-center-3:
    <<: *api-center-common
    container_name: api-center-3

  # ---------------------------------------------------------------------------
  # Logistics-Service (mock upstream) — JWT-protected NestJS service
  # ---------------------------------------------------------------------------
  logistics-service:
    build:
      context: ./examples/sandbox
      dockerfile: logistics-service/Dockerfile
    container_name: logistics-service
    environment:
      PORT: "4000"
      JWKS_URL: http://nginx/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: api-center-dev
    expose:
      - "4000"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      api-center-network:
        aliases:
          - logistics-service.local

  # ---------------------------------------------------------------------------
  # Demand-Service (mock consumer) — uses @apicenter/sdk via gateway front door
  # ---------------------------------------------------------------------------
  demand-service:
    build:
      context: ./examples/sandbox
      dockerfile: demand-service/Dockerfile
    container_name: demand-service
    environment:
      PORT: "4100"
      APICENTER_URL: http://nginx
      DEMAND_TRIBE_ID: demand-service
      DEMAND_TRIBE_SECRET: "${DEMAND_TRIBE_SECRET:-sandbox-change-me}"
    ports:
      - "4100:4100"
    depends_on:
      nginx:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      api-center-network:
        aliases:
          - demand-service.local

  # ---------------------------------------------------------------------------
  # Redis — Service Registry + Token Store  (stateless guarantee, checklist §1)
  # ---------------------------------------------------------------------------
  # Shared by all 3 gateway containers.
  # Stores:
  #   • Service registry entries  →  api-center:registry:services (hash)
  #   • Refresh tokens            →  refresh:{jti}  (string + TTL)
  #   • Session token indexes     →  session:{sub}  (set)
  # Persistence: RDB snapshot every 60 s if ≥1 write — registry survives restarts.
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6381:6379"
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 256mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  3
    volumes:
      - redis-cache-data:/data
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Redis — Rate-limit counters  (distributed throttling, checklist §8)
  # ---------------------------------------------------------------------------
  # Separate instance: a rate-limit storm cannot evict registry/token entries.
  # LRU eviction is safe here — counters are ephemeral and will self-reset.
  # ---------------------------------------------------------------------------
  redis-rate-limit:
    image: redis:7-alpine
    container_name: redis-rate-limit
    ports:
      - "6380:6379"
    command: >
      redis-server
        --loglevel warning
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  3
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Vault — Secrets + Transit signing (dev mode for local development)
  # ---------------------------------------------------------------------------
  # In production: use a properly unsealed HA Vault cluster with AppRole auth.
  # Dev root token: root   |   UI: http://localhost:8200/ui
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID:  root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: warn
    cap_add:
      - IPC_LOCK
    command: vault server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout:  5s
      retries:  3
      start_period: 5s
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics scraping  (checklist §8 — "ready for future monitoring")
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Grafana — Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-local-change-in-prod}"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Jaeger — Distributed tracing
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # HTTP collector
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Payment Service — PayMongo shared gateway
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: paymongo/Dockerfile
    container_name: payment-service
    ports:
      - "4010:4010"
    environment:
      PORT: "4010"
      SERVICE_BASE_URL: "http://payment-service:4010"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      PAYMENT_PROVIDER_MODE: "${PAYMENT_PROVIDER_MODE:-test}"
      PAYMONGO_TEST_SECRET_KEY: "${PAYMONGO_TEST_SECRET_KEY:-}"
      PAYMONGO_LIVE_SECRET_KEY: "${PAYMONGO_LIVE_SECRET_KEY:-}"
      PAYMONGO_TEST_WEBHOOK_SECRET: "${PAYMONGO_TEST_WEBHOOK_SECRET:-}"
      PAYMONGO_LIVE_WEBHOOK_SECRET: "${PAYMONGO_LIVE_WEBHOOK_SECRET:-}"
      PAYMENT_PROVIDER_NAME: "paymongo"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Email Service — Resend-backed email gateway
  # ---------------------------------------------------------------------------
  email-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: email-gateway/Dockerfile
    container_name: email-service
    ports:
      - "4012:4012"
    environment:
      PORT: "4012"
      SERVICE_BASE_URL: "http://email-service:4012"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-noreply@example.com}"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Google Auth Service — Google OAuth gateway
  # ---------------------------------------------------------------------------
  gauth-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: gauth-gateway/Dockerfile
    container_name: gauth-service
    ports:
      - "4013:4013"
    environment:
      PORT: "4013"
      SERVICE_BASE_URL: "http://gauth-service:4013"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # SMS Service — mock SMS gateway
  # ---------------------------------------------------------------------------
  sms-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: sms-gateway/Dockerfile
    container_name: sms-service
    ports:
      - "4011:4011"
    environment:
      PORT: "4011"
      SERVICE_BASE_URL: "http://sms-service:4011"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # OTP Service — OTP generation and verification gateway
  # ---------------------------------------------------------------------------
  otp-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: otp-gateway/Dockerfile
    container_name: otp-service
    ports:
      - "4014:4014"
    environment:
      PORT: "4014"
      SERVICE_BASE_URL: "http://otp-service:4014"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

  # ---------------------------------------------------------------------------
  # Geo Service - Google Maps geocoding + platform geofence checks
  # ---------------------------------------------------------------------------
  geo-service:
    build:
      context: ../api-shared-services/shared-services
      dockerfile: geo-gateway/Dockerfile
    container_name: geo-service
    ports:
      - "4015:4015"
    environment:
      PORT: "4015"
      SERVICE_BASE_URL: "http://geo-service:4015"
      API_CENTER_URL: "http://api-center-1:3000"
      PLATFORM_ADMIN_SECRET: "${PLATFORM_ADMIN_SECRET}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GOOGLE_MAPS_GEOCODING_URL: "${GOOGLE_MAPS_GEOCODING_URL:-https://maps.googleapis.com/maps/api/geocode/json}"
      NODE_ENV: "development"
    depends_on:
      - api-center-1
    restart: unless-stopped
    networks:
      - api-center-network

# =============================================================================
networks:
  api-center-network:
    driver: bridge
    # All containers on this internal network.
    # Only the following ports are exposed to the host:
    #   :3000  NGINX (consumer entrypoint)
    #   :8200  Vault UI (dev)
    #   :9090  Prometheus
    #   :3001  Grafana
    #   :16686 Jaeger

volumes:
  redis-cache-data:   # Service registry persists across container restarts
  prometheus-data:
  grafana-data:
    driver: local
