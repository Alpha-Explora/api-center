server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # TLS terminates at the load balancer; keep directory redirects on the public origin.
  absolute_redirect off;

  # The static search index has no file extension.
  location = /api/search {
    default_type application/json;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
