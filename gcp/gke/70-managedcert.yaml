# =============================================================================
# 70-managedcert.yaml — Google-managed TLS cert for the Ingress
# =============================================================================
# Google provisions and renews a TLS cert for the listed domains automatically.
# Provisioning takes 10-20 minutes after the Ingress is up AND the DNS A
# record points at the reserved static IP from `gcloud compute addresses
# create api-center-ip --global`.
#
# Replace before applying:
#   api-center.example.com   e.g. api.example.com
# =============================================================================
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api-center-cert
  namespace: api-center
spec:
  domains:
    - api-center.example.com
