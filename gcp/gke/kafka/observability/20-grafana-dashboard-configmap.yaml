apiVersion: v1
kind: ConfigMap
metadata:
  name: api-center-kafka-dashboard
  namespace: kafka
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: api-center-kafka
    app.kubernetes.io/part-of: api-center
data:
  api-center-kafka-dashboard.json: |
    {
      "title": "APICenter Kafka Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "stat",
          "title": "Broker Count",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            { "expr": "kafka_brokers", "legendFormat": "brokers" }
          ]
        },
        {
          "type": "stat",
          "title": "Under Replicated Partitions",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            { "expr": "sum(kafka_topic_partition_under_replicated_partition)", "legendFormat": "urp" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Consumer Lag (APICenter)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (consumergroup) (kafka_consumergroup_lag{consumergroup=~\"api-center-.*\"})",
              "legendFormat": "{{consumergroup}}"
            }
          ]
        }
      ]
    }
