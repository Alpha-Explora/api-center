apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: api-center
  namespace: kafka
  labels:
    strimzi.io/cluster: api-center-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operations:
          - Describe
      - resource:
          type: cluster
        operations:
          - IdempotentWrite
      - resource:
          type: topic
          name: api-center.
          patternType: prefix
        operations:
          - Create
          - Describe
          - Read
          - Write
      - resource:
          type: group
          name: api-center-
          patternType: prefix
        operations:
          - Describe
          - Read
