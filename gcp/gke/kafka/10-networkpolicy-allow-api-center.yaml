apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-allow-api-center
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: api-center-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-center
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api-center
      ports:
        - protocol: TCP
          port: 9092
