# =============================================================================
# 80-ingress.yaml — GKE Ingress fronted by Google Cloud Load Balancer
# =============================================================================
# Uses the GCE ingress class (built into GKE), a global static IP, and the
# ManagedCertificate from 70-managedcert.yaml. HTTPS only — HTTP is disabled.
#
# Prereqs:
#   gcloud compute addresses create api-center-ip --global
#   # Point your DNS A record at:
#   gcloud compute addresses describe api-center-ip --global --format='value(address)'
#
# Replace before applying:
#   api-center.example.com   must match the domain in 70-managedcert.yaml
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-center
  namespace: api-center
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "api-center-ip"
    networking.gke.io/managed-certificates: "api-center-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: api-center.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-center
                port:
                  number: 80
