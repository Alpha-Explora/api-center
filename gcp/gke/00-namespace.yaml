# =============================================================================
# 00-namespace.yaml — Dedicated namespace for the api-center gateway
# =============================================================================
# Keeps the gateway, its KSA, ConfigMap, Service, HPA, and Ingress isolated
# from other workloads in the cluster. Apply first.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: api-center
  labels:
    app.kubernetes.io/name: api-center
    app.kubernetes.io/part-of: platform-gateway
