# =============================================================================
# 40-service.yaml — ClusterIP Service fronting api-center pods
# =============================================================================
# The GKE Ingress in 80-ingress.yaml uses container-native load balancing
# (NEGs), so this Service must be ClusterIP, not NodePort. The
# `cloud.google.com/neg` annotation tells GKE to create a NEG, and the
# `cloud.google.com/backend-config` annotation wires the BackendConfig from
# 41-backendconfig.yaml so GCLB health-checks /api/v1/health/ready.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-center
  namespace: api-center
  labels:
    app.kubernetes.io/name: api-center
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "api-center-backend"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-center
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP


