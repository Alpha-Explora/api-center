apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-center
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "api-center-test-ip"
spec:
  rules:
    - host: api-center-test.itsandbox.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-center
                port:
                  number: 80
