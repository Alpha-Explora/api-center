# =============================================================================
# 20-configmap.yaml — Non-secret runtime config for api-center
# =============================================================================
# Anything sensitive (JWT keys, tribe secrets, OAuth client secrets, etc.)
# MUST live in GCP Secret Manager and be loaded at startup by
# secrets.service.ts via GCP_SECRET_NAME — NOT in this ConfigMap.
#
# Replace placeholders before applying:
#   api-center-496422            GCP project ID
#   api-center-prod           Secret Manager secret name (e.g. api-center-prod)
#   10.88.197.107      Memorystore "api-center-cache" host (10.x.x.x)
#   KAFKA_BROKERS / KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD live in Secret Manager
#   JWT_PRIVATE_KEY / JWT_PUBLIC_KEY live in Secret Manager
#   *       comma-separated, e.g. https://app.example.com
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-center-config
  namespace: api-center
data:
  NODE_ENV: "production"
  PORT: "3000"

  # GCP Secret Manager — secrets.service.ts merges this secret into process.env
  GCP_PROJECT_ID: "api-center-496422"
  GCP_SECRET_NAME: "api-center-prod"

  # Shared Redis (Memorystore). Low-traffic production uses one 1 GiB Basic
  # instance for registry, token, and rate-limit state. Rate-limit keys are
  # prefixed with `throttle:*`, so they can share the cache instance safely.
  REDIS_CACHE_URL: "redis://10.88.197.107:6379"
  REDIS_RATE_LIMIT_URL: "redis://10.88.197.107:6379"

  # Kafka event bus. Active production path is Confluent Cloud; bootstrap and
  # SASL credentials are secrets loaded from GCP Secret Manager.
  DATA_PIPELINE_ENABLED: "false"
  KAFKA_ENABLED: "false"
  KAFKA_TOPIC_PREFIX: "prod."
  KAFKA_SSL_ENABLED: "true"
  KAFKA_SSL_REJECT_UNAUTHORIZED: "true"
  KAFKA_SASL_MECHANISM: "plain"
  KAFKA_CLIENT_ID: "api-center"
  KAFKA_GROUP_ID: "api-center-group"

  # CORS — NGINX is gone in GKE, so the Node app handles preflight directly
  ALLOWED_ORIGINS: "https://api-center.itsandbox.site"

  # Auth provider - composite / internal-jwt / descope / dev-jwt
  AUTH_PROVIDER: "composite"
  INTERNAL_JWT_ISSUER: "https://api-center.itsandbox.site"
  INTERNAL_JWT_AUDIENCE: "api-center"
  INTERNAL_JWT_ACCESS_TTL_SECONDS: "3600"
  INTERNAL_JWT_REFRESH_TTL_SECONDS: "86400"
  DESCOPE_BASE_URL: "https://api.descope.com"
  DESCOPE_PROJECT_ID: "P3CDYwDpERyUJPEfqnppZM7HLySN"
  DESCOPE_ISSUER: "https://api.descope.com/v1/apps/P3CDYwDpERyUJPEfqnppZM7HLySN"
  DESCOPE_AUDIENCE: "P3CDYwDpERyUJPEfqnppZM7HLySN"
  DESCOPE_JWKS_URI: "https://api.descope.com/P3CDYwDpERyUJPEfqnppZM7HLySN/.well-known/jwks.json"
  DESCOPE_TOKEN_ENDPOINT: "https://api.descope.com/oauth2/v1/apps/token"

  # Rate limiting (per replica; counters live in REDIS_RATE_LIMIT_URL)
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"

  # Observability
  OTEL_SERVICE_NAME: "api-center"

  # Curated data-pipeline dashboard reads. API Center reads Athena through the
  # AWS SDK; AWS credentials stay in GCP Secret Manager, not this ConfigMap.
  PIPELINE_HEALTH_SOURCE: "athena"
  PIPELINE_GOVERNANCE_SOURCE: "athena"
  PIPELINE_HEALTH_ATHENA_DATABASE: "gold_platform"
  PIPELINE_GOVERNANCE_ATHENA_DATABASE: "gold_platform"
  PIPELINE_HEALTH_QUERY_LIMIT: "100"
  PIPELINE_GOVERNANCE_QUERY_LIMIT: "100"
  AWS_REGION: "ap-southeast-2"

  # Governed event publishing. Prod rejects tribe events unless an approved
  # schema is present in this registry.
  EVENT_SCHEMA_REGISTRY_FILE: "/app/config/event-schema-registry.json"
  EVENT_SCHEMA_REGISTRY_VERSION: "apicenter-event-schemas-2026-05-21"
  EVENT_SCHEMA_TEST_DISCOVERY_ENABLED: "false"
