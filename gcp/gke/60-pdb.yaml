# =============================================================================
# 60-pdb.yaml — PodDisruptionBudget for api-center
# =============================================================================
# Keeps one healthy pod during voluntary disruptions. This matches the current
# cost-saving HPA profile with minReplicas=2 and permits one pod to drain while
# the other continues serving traffic.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-center
  namespace: api-center
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-center


