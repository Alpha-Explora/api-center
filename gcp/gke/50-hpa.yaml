# =============================================================================
# 50-hpa.yaml — HorizontalPodAutoscaler for api-center
# =============================================================================
# Scales the api-center Deployment between 2 and 3 replicas based on CPU
# and memory utilization measured against the container `requests` set in
# 30-deployment.yaml. Autopilot ships metrics-server, so no extra install.
#
# Sizing:
#   minReplicas: 2   keeps one spare pod while reducing idle workload spend
#   maxReplicas: 3   enough burst headroom for the current low-traffic cluster
#
# Behavior:
#   scaleUp     fast (30s window) so traffic spikes are absorbed quickly
#   scaleDown   slow (300s window) so a brief lull doesn't drop pods that
#               will be needed again seconds later
#
# TODO: switch to request-rate-based scaling once the Cloud Monitoring custom
#       metrics adapter is installed. The relevant external metric would be
#       loadbalancing.googleapis.com|https|request_count from the GCLB.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-center
  namespace: api-center
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-center
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max


