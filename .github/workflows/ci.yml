# =============================================================================
# GitHub Actions CI/CD Pipeline — API Center
# =============================================================================
# This workflow runs on every push and pull request to main.
#
# WHAT IT DOES:
#  1. Lint    — Checks code style and catches common issues
#  2. Build   — Compiles TypeScript to verify no type errors
#  3. Test    — Runs the full test suite
#  4. Docker  — Builds the Docker image to verify it works
#
# WHY CI/CD:
#  - Catches bugs BEFORE they reach production
#  - Every PR is automatically validated
#  - No manual "did you run the tests?" — the pipeline enforces it
#  - The team can trust that main branch always compiles and passes tests
#
# SECRETS NEEDED (set in GitHub repo → Settings → Secrets):
#  - None for basic CI. For deployment, add DOCKER_USERNAME, DOCKER_PASSWORD, etc.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Enforce gateway and SDK boundaries
        run: npm run check:boundaries

      - name: Test gateway boundary checker
        run: npm run check:boundaries:test

      - name: Enforce workspace package boundaries
        run: npm run check:monorepo

      - name: Enforce environment naming
        run: npm run check:environment-naming

      - name: Enforce gateway and SDK contract compatibility
        run: npm run check:contracts
        env:
          ALLOW_MISSING_EXTERNAL_MANIFESTS: 'true'

      - name: Validate public contracts
        run: npm run contracts:validate

      - name: TypeScript type check across workspaces
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Job 2: Build
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build all workspaces
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/*/dist/
            apps/*/.next/
            packages/*/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build docs (the docs test reads the static export)
        run: npm run docs:build

      - name: Run gateway and workspace tests
        run: npm run test:all
        env:
          NODE_ENV: test
          ALLOW_MISSING_EXTERNAL_MANIFESTS: 'true'

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          ALLOW_MISSING_EXTERNAL_MANIFESTS: 'true'

      - name: Run HTTP E2E tests
        run: npm run test:e2e -- --runInBand
        env:
          NODE_ENV: test
          ALLOW_MISSING_EXTERNAL_MANIFESTS: 'true'

  # ---------------------------------------------------------------------------
  # Job 4: Migration replay (the Supabase chain must build an empty database)
  # ---------------------------------------------------------------------------
  migrations:
    name: Migration Replay
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Replay migrations onto an empty database and verify the schema
        run: npm run db:verify:replay
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/replay

      - name: Test the payment event dispatcher against the replayed database
        run: npm run db:test:payment-outbox
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/replay

  # ---------------------------------------------------------------------------
  # Job 5: Docker Build (verify Dockerfile works)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-center:${{ github.sha }} .

      - name: Build payment runtime image
        run: docker build -f docker/Dockerfile.payments.gcp -t api-center-payments:${{ github.sha }} .

      - name: Verify the payment image ships the event dispatcher
        run: docker run --rm --entrypoint test api-center-payments:${{ github.sha }} -f dist/events/paymentEventDispatcher.js

      - name: Build shared runtime images
        run: |
          for service in email sms otp geo gauth; do
            docker build -f Dockerfile.shared-service --build-arg SERVICE="$service" -t "api-center-$service:${{ github.sha }}" .
          done

      - name: Verify image runs
        run: |
          set -euo pipefail
          cleanup() {
            docker logs api-center-test || true
            docker stop api-center-test || true
          }
          trap cleanup EXIT
          docker run --rm -d --name api-center-test \
            -e PORT=3000 \
            -e NODE_ENV=test \
            -e KAFKA_BROKERS=localhost:9092 \
            -p 3000:3000 \
            api-center:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health/live; then
              exit 0
            fi
            sleep 2
          done
          echo "API Center container did not pass liveness within 60 seconds."
          exit 1

      - name: Smoke test payment and shared runtime images
        shell: bash
        run: |
          set -euo pipefail
          smoke_runtime() {
            local image="$1"
            local name="apicenter-runtime-smoke"
            docker run --rm -d --name "$name" \
              -e NODE_ENV=test -e PORT=8080 \
              -p 18080:8080 \
              "$image"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
                docker stop "$name" >/dev/null
                return 0
              fi
              sleep 2
            done
            docker logs "$name" || true
            docker stop "$name" || true
            return 1
          }
          smoke_runtime "api-center-payments:${{ github.sha }}"
          for service in email sms otp geo gauth; do
            smoke_runtime "api-center-${service}:${{ github.sha }}"
          done
