name: Publish APICenter SDK to GitHub Packages

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Validate public contracts
        run: npm run contracts:validate

      - name: Validate SDK compatibility
        run: npm run check:sdk-contracts

      - name: Build SDK
        run: npm run sdk:build

      - name: Create pack directory
        run: mkdir -p artifacts

      - name: Pack SDK
        run: npm pack --workspace @alpha-explora/apicenter-sdk --pack-destination artifacts

      - name: Publish SDK to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish artifacts/*.tgz --registry=https://npm.pkg.github.com
