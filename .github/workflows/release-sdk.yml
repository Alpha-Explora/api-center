name: Publish APICenter SDK

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Validate public contracts
        run: npm run contracts:validate

      - name: Validate SDK compatibility
        run: npm run check:sdk-contracts

      - name: Build SDK
        run: npm run sdk:build

      - name: Pack SDK
        run: npm pack --workspace @apicenter/sdk --pack-destination artifacts

      - name: Publish SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish artifacts/*.tgz --access public
