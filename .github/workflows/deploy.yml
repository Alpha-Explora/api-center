# =============================================================================
# GitHub Actions — Deploy Pipeline (triggered on release)
# =============================================================================
# Runs when a new tag (v*.*.*) is pushed:
#   1. build-and-push  → builds the image and pushes it to Artifact Registry
#                        (and optionally Docker Hub if DOCKERHUB_PUSH=true)
#   2. deploy-gke      → rolls the new image out to the api-center Deployment
#                        on the GKE Autopilot cluster (HPA keeps replica count)
#
# AUTH: Workload Identity Federation — no JSON keys checked into the repo.
#
# REQUIRED REPO VARIABLES (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID            e.g. my-project
#   GCP_REGION                e.g. us-central1
#   GCP_ARTIFACT_REPO         e.g. api-center
#   GKE_CLUSTER_NAME          e.g. api-center
#   GKE_NAMESPACE             e.g. api-center
#   GCP_WORKLOAD_IDENTITY_PROVIDER  full WIF provider resource path
#   GCP_DEPLOY_SA             e.g. github-deployer@<PROJECT>.iam.gserviceaccount.com
#
# OPTIONAL (only if you also push to Docker Hub):
#   DOCKERHUB_PUSH=true  +  DOCKER_USERNAME / DOCKER_PASSWORD secrets
# =============================================================================

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push image to Artifact Registry
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (Artifact Registry)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image reference
        id: meta
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/api-center"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Optional: also push to Docker Hub for external consumers ----
      - name: Login to Docker Hub
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            docker.io/your-org/api-center:${{ steps.version.outputs.VERSION }}
            docker.io/your-org/api-center:latest

  # ---------------------------------------------------------------------------
  # 2. Roll the new image out to GKE
  # ---------------------------------------------------------------------------
  deploy-gke:
    name: Roll out to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}

      - name: Set image on Deployment
        run: |
          kubectl -n ${{ vars.GKE_NAMESPACE }} set image \
            deployment/api-center \
            api-center=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.version }}

      - name: Wait for rollout
        run: |
          kubectl -n ${{ vars.GKE_NAMESPACE }} rollout status \
            deployment/api-center --timeout=5m

      - name: Show HPA status
        run: kubectl -n ${{ vars.GKE_NAMESPACE }} get hpa api-center
