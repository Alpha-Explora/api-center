name: API Center CI

# Manual only. Start a run with: gh workflow run api-center-ci.yml --ref <branch>
on:
  workflow_dispatch:

jobs:
  api-center:
    runs-on: ubuntu-latest
    # The secrets context is not available in step conditions, so expose the values as environment variables.
    env:
      APICENTER_SMOKE_BASE_URL: ${{ secrets.APICENTER_SMOKE_BASE_URL }}
      APICENTER_SMOKE_TRIBE_TOKEN: ${{ secrets.APICENTER_SMOKE_TRIBE_TOKEN }}
      APICENTER_SMOKE_APPROVER_TOKEN: ${{ secrets.APICENTER_SMOKE_APPROVER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Deployed quota smoke
        if: ${{ env.APICENTER_SMOKE_BASE_URL != '' && env.APICENTER_SMOKE_TRIBE_TOKEN != '' && env.APICENTER_SMOKE_APPROVER_TOKEN != '' }}
        env:
          API_CENTER_PLATFORM_ADMIN_SECRET: ${{ secrets.API_CENTER_PLATFORM_ADMIN_SECRET }}
          APICENTER_SMOKE_TRIBE_ID: smoke-tribe
        run: npm run smoke:quota

      - name: Skip deployed quota smoke (missing approver token)
        if: ${{ env.APICENTER_SMOKE_BASE_URL != '' && env.APICENTER_SMOKE_TRIBE_TOKEN != '' && env.APICENTER_SMOKE_APPROVER_TOKEN == '' }}
        run: echo "::warning::Skipping deployed quota smoke because repository secret APICENTER_SMOKE_APPROVER_TOKEN is missing."
