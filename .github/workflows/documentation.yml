name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs/**'
      - 'contracts/public/**'
      - 'packages/contracts/**'
      - 'packages/sdk/**'
      - 'scripts/contracts/**'
      - 'scripts/check-documentation.mjs'
      - 'tests/integration/scripts/check-documentation.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:documentation
      - run: npm run test:documentation
      - run: npm run contracts:validate
      - run: npm run docs:build
      - run: npm run docs:test
      - run: npm run typecheck --workspace @apicenter/docs
