                    const: true
                  data:
                    $ref: "#/components/schemas/GoogleLogoutResponse"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid request, credentials or idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: A valid APICenter service bearer token is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Scopes, service dependency, project policy or caller context are not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: The resource is not available in this project and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "429":
          description: Request or project delivery quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "500":
          description: Provider configuration is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "502":
          description: Provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Runtime, storage or provider configuration is unavailable. An uncertain delivery outcome must be reconciled before another send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLogoutRequest"
            example:
              refreshToken: <google-refresh-token>
  /api/v1/auth/token:
    post:
      operationId: issueToken
      tags:
        - Identity
      summary: issueToken
      description: Server-side service authentication. Keep service secrets and refresh tokens out of browser code.
      security: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/ServiceTokenResponse"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid credentials or request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Service placement or authorization is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: Service or signing-key endpoint is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Identity provider or credential store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenRequest"
            example:
              serviceId: example-api
              environment: test
              secret: <server-only-service-secret>
  /api/v1/auth/token/refresh:
    post:
      operationId: refreshServiceToken
      tags:
        - Identity
      summary: refreshServiceToken
      description: Server-side service authentication. Keep service secrets and refresh tokens out of browser code.
      security: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/RefreshTokenResponse"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid credentials or request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Service placement or authorization is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: Service or signing-key endpoint is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Identity provider or credential store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            example:
              refreshToken: <refresh-token>
  /api/v1/auth/token/revoke:
    post:
      operationId: revokeServiceToken
      tags:
        - Identity
      summary: revokeServiceToken
      description: Server-side service authentication. Keep service secrets and refresh tokens out of browser code.
      security:
        - ServiceBearerAuth: []
      responses:
        "204":
          description: Refresh token revoked. No response body.
        "400":
          description: Invalid credentials or request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Service placement or authorization is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: Service or signing-key endpoint is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Identity provider or credential store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
            example:
              refreshToken: <refresh-token>
              revokeAll: false
  /api/v1/auth/.well-known/jwks.json:
    get:
      operationId: getJwks
      tags:
        - Identity
      summary: getJwks
      description: Public signing keys when supported by the configured auth provider. Returns raw JWKS.
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "400":
          description: Invalid credentials or request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Service placement or authorization is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: Service or signing-key endpoint is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Identity provider or credential store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
components:
  securitySchemes:
    ServiceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Registered APICenter service JWT with gateway-enforced scopes.
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: APICenterApiKey
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key for safely retrying this payment mutation. Reuse the same key and request body after uncertain outcomes. A key used with a different request, an in-progress request, or an unresolved provider outcome returns HTTP 409.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
        pattern: ^chk_[A-Za-z0-9_]+$
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pi_[A-Za-z0-9_]+$
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        pattern: ^cus_[A-Za-z0-9_]+$
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ref_[A-Za-z0-9_]+$
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^sub_[A-Za-z0-9_]+$
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^inv_[A-Za-z0-9_]+$
    ReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - error
            properties:
              success:
                const: false
              error:
                $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - error
            properties:
              success:
                const: false
              error:
                $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: >-
        The key was used with a different request, is already processing, or the provider outcome remains unresolved. Inspect `error.code`; in particular, `PAYMENT_OUTCOME_UNKNOWN` requires reconciliation before using a new key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Pending:
      description: Provider outcome is pending confirmation
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
            properties:
              success:
                const: true
              data:
                $ref: "#/components/schemas/PendingResource"
  schemas:
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          minimum: 1
          description: Final gross amount in minor PHP units.
        currency:
          type: string
          enum:
            - PHP
    CheckoutCreateRequest:
      type: object
      required:
        - referenceId
        - amount
        - successUrl
        - cancelUrl
      properties:
        referenceId:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: "#/components/schemas/Money"
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Consumer-owned correlation metadata. Do not include secrets.
    PaymentIntentCreateRequest:
      type: object
      required:
        - referenceId
        - amount
      properties:
        referenceId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    ConfirmPaymentIntentRequest:
      type: object
      required:
        - paymentMethodId
        - clientKey
        - returnUrl
      properties:
        paymentMethodId:
          type: string
          minLength: 1
          description: Payment method ID created through the provider's client-side payment flow.
        clientKey:
          type: string
          minLength: 1
          description: Client key returned for this payment intent.
        returnUrl:
          type: string
          format: uri
    CustomerCreateRequest:
      type: object
      required:
        - customerReference
        - email
      properties:
        customerReference:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 255
    RefundCreateRequest:
      type: object
      required:
        - paymentId
        - amount
      properties:
        paymentId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
    SubscriptionCreateRequest:
      type: object
      required:
        - customerId
        - referenceId
        - priceId
      properties:
        customerId:
          type: string
        referenceId:
          type: string
        priceId:
          type: string
          description: APICenter-managed recurring price reference.
    Checkout:
      type: object
      required:
        - checkoutId
        - referenceId
        - status
        - amount
      properties:
        checkoutId:
          type: string
        referenceId:
          type: string
        status:
          type: string
          enum:
            - created
            - pending
            - paid
            - failed
            - cancelled
            - expired
        amount:
          $ref: "#/components/schemas/Money"
        checkoutUrl:
          type: string
          format: uri
        aggregateVersion:
          type: integer
          minimum: 1
    PaymentIntent:
      type: object
      required:
        - paymentIntentId
        - referenceId
        - status
        - amount
      properties:
        paymentIntentId:
          type: string
        referenceId:
          type: string
        status:
          type: string
          enum:
            - requires_action
            - pending
            - processing
            - succeeded
            - failed
            - cancelled
        amount:
          $ref: "#/components/schemas/Money"
        aggregateVersion:
          type: integer
          minimum: 1
        clientKey:
          type: string
          description: Short-lived client key for client-side operations on this payment intent; not a secret API key.
        nextAction:
          type: object
          properties:
            type:
              type: string
              enum: [redirect]
            redirectUrl:
              type: string
              format: uri
            returnUrl:
              type: string
              format: uri
    Customer:
      type: object
      required:
        - customerId
        - customerReference
      properties:
        customerId:
          type: string
        customerReference:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Refund:
      type: object
      required:
        - refundId
        - paymentId
        - status
        - amount
      properties:
        refundId:
          type: string
        paymentId:
          type: string
        status:
          type: string
          enum:
            - pending
            - processing
            - succeeded
            - failed
        amount:
          $ref: "#/components/schemas/Money"
    Subscription:
      type: object
      required:
        - subscriptionId
        - customerId
        - status
      properties:
        subscriptionId:
          type: string
        customerId:
          type: string
        status:
          type: string
          enum:
            - active
            - past_due
            - cancelled
            - pending
        currentPeriodEnd:
          type: string
          format: date-time
    Invoice:
      type: object
      required:
        - invoiceId
        - status
        - amount
      properties:
        invoiceId:
          type: string
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - past_due
            - void
        amount:
          $ref: "#/components/schemas/Money"
    PaymentCapabilities:
      type: object
      required:
        - currency
        - paymentMethods
        - resources
      properties:
        currency:
          type: string
          enum:
            - PHP
        paymentMethods:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    PaymentRecord:
      type: object
      required: [ type, id, projectId, environment, referenceId, relatedResourceId, amountMinor, currency, status, createdAt ]
      properties:
        type: { type: string }
        id: { type: string }
        projectId: { type: string }
        environment: { type: string, enum: [ test, live ] }
        referenceId: { type: [ string, 'null' ] }
        amountMinor: { type: [ string, 'null' ], pattern: '^-?[0-9]+$' }
        currency: { type: [ string, 'null' ] }
        status: { type: [ string, 'null' ] }
        createdAt: { type: string, format: date-time }
        relatedResourceId: { type: [ string, 'null' ] }
    PaymentRecordPage:
      type: object
      required: [ records ]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/PaymentRecord" }
        nextCursor: { type: string }
    PendingResource:
      type: object
      required:
        - status
        - resourceId
      properties:
        status:
          type: string
          enum:
            - pending
        resourceId:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        detail: {}
    SuccessEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          const: true
        data: {}
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          const: false
        error:
          $ref: "#/components/schemas/Error"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            correlationId:
              type: string
    PlanCreateRequest:
      type: object
      required:
        - name
        - amount
        - interval
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        amount:
          type: integer
          minimum: 2000
          description: Amount in PHP centavos.
        currency:
          type: string
          enum:
            - PHP
          default: PHP
        interval:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        cycleCount:
          type: integer
          minimum: 2
          description: Omit to bill indefinitely.
        metadata:
          type: object
          additionalProperties:
            type: string
    Plan:
      type: object
      required:
        - planId
        - name
        - amount
        - currency
        - interval
        - intervalCount
      properties:
        planId:
          type: string
        name:
          type: string
        description:
          type: string
        amount:
          type: integer
          description: Amount in PHP centavos.
        currency:
          type: string
          enum:
            - PHP
        interval:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
        cycleCount:
          type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
    PaymentLinkCreateRequest:
      type: object
      required:
        - referenceId
        - amount
        - description
      properties:
        referenceId:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          minLength: 1
          maxLength: 255
        remarks:
          type: string
          maxLength: 255
        metadata:
          type: object
          additionalProperties:
            type: string
          description: String values only. APICenter sets apicenter_reference_id to referenceId.
    PaymentLink:
      type: object
      required:
        - paymentLinkId
        - referenceId
        - amount
        - status
      properties:
        paymentLinkId:
          type: string
        referenceId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          description: active or archived from PayMongo, or paid once PayMongo reports a payment for the link.
        active:
          type: boolean
        archived:
          type: boolean
        referenceNumber:
          type: string
          description: Reference number PayMongo assigned to the link.
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QrPhPaymentIntent:
      type: object
      required:
        - paymentIntentId
        - referenceId
        - status
        - amount
        - qrCodeImageUrl
        - expirySeconds
      properties:
        paymentIntentId:
          type: string
        referenceId:
          type: string
        status:
          type: string
          description: awaiting_next_action means the QR code is ready, not that payment is complete.
        amount:
          $ref: "#/components/schemas/Money"
        qrCodeImageUrl:
          type: string
          format: uri
        expirySeconds:
          type: integer
    QrPhPaymentIntentCreateRequest:
      type: object
      required:
        - referenceId
        - amount
      properties:
        referenceId:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          maxLength: 255
        expirySeconds:
          type: integer
          minimum: 60
          maximum: 9000
          default: 1800
    SharedError:
      type: object
      properties:
        success:
          const: false
        error:
          type: object
          properties:
            code: &a1
              type: string
            message: *a1
            details: {}
          required:
            - code
            - message
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            correlationId: *a1
      required:
        - success
        - error
    EmailSendRequest:
      type: object
      properties:
        from: &a3
          type: string
        to:
          anyOf:
            - &a2
              anyOf:
                - &a1
                  type: string
                  minLength: 1
                - type: object
                  properties:
                    email: *a1
                  required:
                    - email
              description: A nonempty address string. Legacy recipient objects containing email are also accepted; syntax is not validated by the runtime.
            - type: array
              items: *a2
              minItems: 1
        subject: *a1
        html: *a3
        text: *a3
      required:
        - to
        - subject
      anyOf:
        - required:
            - html
          properties:
            html: *a1
        - required:
            - text
          properties:
            text: *a1
      not:
        anyOf:
          - required:
              - templateId
          - required:
              - templateVariables
    EmailSendResponse:
      type: object
      properties:
        messageId: &a1
          type: string
        provider: *a1
        status: *a1
        recipient:
          type: array
          items: *a1
        recipientCount:
          type: integer
        sentAt:
          type: string
          format: date-time
      required:
        - messageId
        - provider
        - status
        - recipient
        - recipientCount
        - sentAt
    EmailDeliveryStatus:
      type: object
      properties:
        messageId: &a1
          type: string
        provider: *a1
        status: *a1
        recipient:
          type: array
          items: *a1
        recipientCount:
          type: integer
        sentAt: &a2
          type: string
          format: date-time
        createdAt: *a2
      required:
        - messageId
        - provider
        - status
        - recipient
        - recipientCount
        - sentAt
        - createdAt
    SmsSendRequest:
      type: object
      properties:
        to: &a1
          type: string
          minLength: 1
        message: *a1
        senderId:
          type: string
      required:
        - to
        - message
      not:
        required:
          - templateId
    SmsSendResponse:
      type: object
      properties:
        messageId: &a1
          type: string
        status: *a1
        to: *a1
        recipient: *a1
        sentAt:
          type: string
          format: date-time
      required:
        - messageId
        - status
        - to
        - sentAt
    SmsDeliveryStatus:
      type: object
      properties:
        messageId: &a1
          type: string
        status: *a1
        to: *a1
        message: *a1
        senderId: *a1
        createdAt:
          type: string
          format: date-time
      required:
        - messageId
        - status
        - to
        - message
        - createdAt
    OtpGenerateRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - sms
        recipient:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
          deprecated: true
          description: Legacy fallback when recipient is absent.
        purpose:
          type: string
          enum:
            - login
            - transaction
            - verification
          description: Accepted correlation purpose; does not change verification behavior.
        digits:
          type: number
          default: 6
