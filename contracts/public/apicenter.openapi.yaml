  /api/v1/payments/intents/qrph:
    post:
      operationId: createQrPhPaymentIntent
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrPhPaymentIntentCreateRequest"
      responses:
        "201":
          description: QR Ph payment intent created; awaiting_next_action is not confirmation of payment.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/QrPhPaymentIntent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/payment-links:
    get:
      operationId: listPaymentLinks
      tags:
        - Payments
      responses:
        "200":
          description: Payment links owned by the calling project
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentLink"
    post:
      operationId: createPaymentLink
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkCreateRequest"
      responses:
        "201":
          description: Payment link created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/payment-links/{paymentLinkId}:
    get:
      operationId: getPaymentLink
      tags:
        - Payments
      responses:
        "200":
          description: Project-owned payment link
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PaymentLink"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: setPaymentLinkArchived
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - archive
              properties:
                archive:
                  type: boolean
      responses:
        "200":
          description: Payment link archive state updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PaymentLink"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/plans:
    get:
      operationId: listPlans
      tags:
        - Payments
      responses:
        "200":
          description: Plans owned by the calling project
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/plans/{planId}:
    get:
      operationId: getPlan
      tags:
        - Payments
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Plan"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/shared/email/send:
    post:
      operationId: email.send
      tags:
        - EMAIL
      summary: email.send
      security:
        - ServiceBearerAuth: []
      description: "Uses the registered service and environment. Default shared runtime authorization requires all listed scopes: email:send.  Reusing the same idempotency key and body replays the original response for seven days. Unknown outcomes require reconciliation."
      x-required-scopes:
        - email:send
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/EmailSendResponse"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid request, credentials or idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: A valid APICenter service bearer token is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Scopes, service dependency, project policy or caller context are not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: The resource is not available in this project and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          description: Request or project delivery quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "500":
          description: Provider configuration is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "502":
          description: Provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Runtime, storage or provider configuration is unavailable. An uncertain delivery outcome must be reconciled before another send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSendRequest"
            example:
              to: recipient@example.test
              subject: Integration verification
              text: A test notification.
  /api/v1/shared/email/status/{messageId}:
    get:
      operationId: email.getStatus
      tags:
        - EMAIL
      summary: email.getStatus
      security:
        - ServiceBearerAuth: []
      description: "Uses the registered service and environment. Default shared runtime authorization requires all listed scopes: email:send. "
      x-required-scopes:
        - email:send
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Resource identifier, scoped to the authenticated project and environment.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/EmailDeliveryStatus"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid request, credentials or idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: A valid APICenter service bearer token is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Scopes, service dependency, project policy or caller context are not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: The resource is not available in this project and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "429":
          description: Request or project delivery quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "500":
          description: Provider configuration is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "502":
          description: Provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Runtime, storage or provider configuration is unavailable. An uncertain delivery outcome must be reconciled before another send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
  /api/v1/shared/sms/send:
    post:
      operationId: sms.send
      tags:
        - SMS
      summary: sms.send
      security:
        - ServiceBearerAuth: []
      description: "Uses the registered service and environment. Default shared runtime authorization requires all listed scopes: sms:send, sms:status.  Reusing the same idempotency key and body replays the original response for seven days. Unknown outcomes require reconciliation."
      x-required-scopes:
        - sms:send
        - sms:status
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/SmsSendResponse"
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      correlationId:
                        type: string
                required:
                  - success
                  - data
        "400":
          description: Invalid request, credentials or idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "401":
          description: A valid APICenter service bearer token is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "403":
          description: Scopes, service dependency, project policy or caller context are not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "404":
          description: The resource is not available in this project and environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          description: Request or project delivery quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "500":
          description: Provider configuration is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "502":
          description: Provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedError"
        "503":
          description: Runtime, storage or provider configuration is unavailable. An uncertain delivery outcome must be reconciled before another send.
