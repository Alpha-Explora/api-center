      responses:
        "200":
          description: Subscription invoices
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
  /api/v1/payments/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Invoice"
  /api/v1/payments/records:
    get:
      operationId: listPaymentRecords
      tags: [ Payments ]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: createdAfter
          in: query
          description: Inclusive ISO 8601 lower bound.
          schema: { type: string, format: date-time }
        - name: createdBefore
          in: query
          description: Exclusive ISO 8601 upper bound.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Project-scoped payment record page.
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { const: true }
                  data: { $ref: "#/components/schemas/PaymentRecordPage" }
  /api/v1/payments/capabilities:
    get:
      operationId: getPaymentCapabilities
      tags:
        - Payments
      responses:
        "200":
          description: Payment capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
