openapi: 3.2.0
info:
  title: APICenter API
  version: 1.0.0
  description: Consumer HTTP API for service authentication, payments, messaging, verification, geolocation and Google sign-in.
servers:
  - url: https://api.apicenter.itsandbox.site
security:
  - ApiKeyAuth: []
  - ServiceBearerAuth: []
tags:
  - name: Payments
  - name: Identity
  - name: EMAIL
  - name: SMS
  - name: OTP
  - name: GEO
  - name: Google Auth
paths:
  /api/v1/payments/checkouts:
    post:
      operationId: createCheckout
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutCreateRequest"
            example:
              referenceId: ACI-20260727-EXAMPLE01
              amount:
                amountMinor: 39900
                currency: PHP
              successUrl: https://app.example.test/billing/success
              cancelUrl: https://app.example.test/billing/cancel
              metadata:
                planId: starter
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Checkout"
              example:
                success: true
                data:
                  checkoutId: chk_example_01
                  referenceId: ACI-20260727-EXAMPLE01
                  status: pending
                  amount:
                    amountMinor: 39900
                    currency: PHP
                  checkoutUrl: https://checkout.example.test/chk_example_01
                  aggregateVersion: 1
        "202":
          $ref: "#/components/responses/Pending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/checkouts/{checkoutId}:
    get:
      operationId: getCheckout
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Checkout
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Checkout"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/payments/checkouts/by-reference/{referenceId}:
    get:
      operationId: getCheckoutByReference
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      responses:
        "200":
          description: Checkout
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Checkout"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/payments/checkouts/{checkoutId}/cancel:
    post:
      operationId: cancelCheckout
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Checkout cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Checkout"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/intents:
    post:
      operationId: createPaymentIntent
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
