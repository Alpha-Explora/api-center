x-apicenter-excluded-routes:
  - path: /api/v1/shared/gauth/verify-token
    reason: Mock-only implementation; not exposed by the service manifest or supported SDK.
  - path: /api/v1/shared/*/health
    reason: Operational probes, not consumer operations.
  - path: /api/v1/admin/*
    reason: Control-plane administration; requires operator authorization.
  - path: provider webhooks
    reason: Provider callbacks use separate verification and are not consumer commands.
