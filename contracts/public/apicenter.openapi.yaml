      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200":
          description: Payment intent
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PaymentIntent"
  /api/v1/payments/intents/{paymentIntentId}/confirm:
    post:
      operationId: confirmPaymentIntent
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
