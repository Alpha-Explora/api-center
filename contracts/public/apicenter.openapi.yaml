              schema:
                $ref: "#/components/schemas/SharedError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLogoutRequest"
            example:
              refreshToken: <google-refresh-token>
  /api/v1/whoami:
    get:
      operationId: whoami
      summary: whoami
      description: Returns the application, project, organization and environment a key belongs to, and its grants. Use it to check a key after setup.
      tags:
        - Account
      responses:
        "200":
          description: The key's identity
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                      - application
                      - project
                      - organizationId
                      - environment
                      - grants
                    properties:
                      application:
                        type: object
                        required:
                          - id
                          - slug
                          - name
                        properties:
                          id:
                            type: string
                          slug:
                            type: string
                          name:
                            type: string
                      project:
                        type: object
                        required:
                          - id
                        properties:
                          id:
                            type: string
                      organizationId:
                        type: string
                      environment:
                        type: string
                        enum:
                          - test
                          - live
                      grants:
                        type: array
                        items:
                          type: string
        "401":
          description: The key is missing, invalid, expired or revoked
components:
  securitySchemes:
    ApplicationKey:
      type: http
      scheme: bearer
      bearerFormat: ApplicationKey
      description: >-
        An application key (ak_test_… or ak_live_…). The key alone identifies the application, its project and its environment; each call needs a grant for its action.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key for safely retrying this payment mutation. Reuse the same key and request body after uncertain outcomes. A key used with a different request, an in-progress request, or an unresolved provider outcome returns HTTP 409.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
        pattern: ^chk_[A-Za-z0-9_]+$
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pi_[A-Za-z0-9_]+$
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        pattern: ^cus_[A-Za-z0-9_]+$
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ref_[A-Za-z0-9_]+$
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^sub_[A-Za-z0-9_]+$
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^inv_[A-Za-z0-9_]+$
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pye_[A-Za-z0-9]+$
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema:
        type: string
        pattern: ^pal_[A-Za-z0-9]+$
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        pattern: ^po_[A-Za-z0-9]+$
    Cursor:
      name: cursor
      in: query
      description: nextCursor from the previous page.
      schema:
        type: string
        maxLength: 500
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - error
            properties:
              success:
                const: false
              error:
                $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - error
            properties:
              success:
                const: false
              error:
                $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: >-
        The key was used with a different request, is already processing, or the provider outcome remains unresolved. Inspect `error.code`; in particular, `PAYMENT_OUTCOME_UNKNOWN` requires reconciliation before using a new key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Pending:
      description: Provider outcome is pending confirmation
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
            properties:
              success:
                const: true
              data:
                $ref: "#/components/schemas/PendingResource"
    Unauthorized:
      description: The application key is missing, malformed, revoked or expired (`UNAUTHORIZED`, `CREDENTIAL_REVOKED`, `CREDENTIAL_EXPIRED`). Do not retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The application lacks a grant for this action, or the capability, environment, project or organization is not enabled (`ACTION_NOT_GRANTED`, `CAPABILITY_NOT_ENABLED`, `ENVIRONMENT_INACTIVE`, `LIVE_PLAN_REQUIRED`). Do not retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests (`RATE_LIMITED`, `PAYMENT_RATE_LIMIT_EXCEEDED`) or the environment's quota is used up (`QUOTA_EXCEEDED`). Retry after `Retry-After` seconds, except for `QUOTA_EXCEEDED`, which lasts until the quota window resets.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: An unexpected failure in APICenter (`INTERNAL_ERROR`). Retry writes only with the same idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpstreamFailure:
      description: The payment provider failed or did not answer in time (`BAD_GATEWAY`, `UPSTREAM_TIMEOUT`, `PAYMENT_UPSTREAM_UNREACHABLE`). Retry writes only with the same idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: APICenter is busy or restarting (`DATABASE_BUSY`, `DATABASE_UNAVAILABLE`, `SERVICE_UNAVAILABLE`). Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          minimum: 1
          description: Final gross amount in minor PHP units.
        currency:
          type: string
          enum:
            - PHP
    AllocationInput:
      type: object
      description: A payee's share of the payment. The shares may not add up to more than the payment.
      required:
        - payeeId
        - amount
      additionalProperties: false
      properties:
        payeeId:
          type: string
          pattern: ^pye_[A-Za-z0-9]+$
        amount:
          $ref: "#/components/schemas/Money"
    Allocation:
      type: object
      description: A payee's share of one payment. awaiting_payment until the payment is confirmed, then held until you release it.
      required:
        - allocationId
        - payeeId
        - amount
        - status
      properties:
        allocationId:
          type: string
        payeeId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [awaiting_payment, held, released, pooled, paid, cancelled]
        paymentId:
          type: [string, "null"]
    PayeeCreateRequest:
      type: object
      required:
        - externalRef
        - legalName
      additionalProperties: false
      properties:
        externalRef:
          type: string
          minLength: 1
          maxLength: 120
          description: Your own identifier for the payee. Payout events carry it as referenceId.
        legalName:
          type: string
          minLength: 1
          maxLength: 200
          description: The name on the payee's account. A mismatch is the most common reason a transfer fails.
    PayoutDestination:
      oneOf:
        - type: object
          required: [type, bic, accountNumber, accountName]
          additionalProperties: false
          properties:
            type:
              const: instapay
            bic:
              type: string
              pattern: ^[A-Z0-9]{8}([A-Z0-9]{3})?$
              description: The receiving institution's code, for example GXCHPHM2XXX for GCash.
            accountNumber:
              type: string
              pattern: ^[0-9]{6,20}$
            accountName:
              type: string
              minLength: 1
              maxLength: 200
        - type: object
          required: [type, accountNumber, accountName]
          additionalProperties: false
          properties:
            type:
              const: provider_wallet
            accountNumber:
              type: string
              pattern: ^[0-9]{6,20}$
            accountName:
              type: string
              minLength: 1
              maxLength: 200
    PayeeDestination:
      type: object
      description: The payee's destination as APICenter returns it; the account number is masked.
      required: [type, accountName, accountNumberLast4]
      properties:
        type:
          type: string
          enum: [instapay, provider_wallet]
        bic:
          type: string
        accountName:
          type: string
        accountNumberLast4:
          type: string
    Payee:
      type: object
      required:
        - payeeId
        - externalRef
        - legalName
        - status
        - destination
        - createdAt
      properties:
        payeeId:
          type: string
        externalRef:
          type: string
        legalName:
          type: string
        status:
          type: string
          enum: [active, suspended]
        destination:
          oneOf:
            - $ref: "#/components/schemas/PayeeDestination"
            - type: "null"
        destinationHoldUntil:
          type: [string, "null"]
          format: date-time
          description: Payouts to the payee wait until this time after a destination change.
        createdAt:
          type: string
          format: date-time
    PayeeEarnings:
      type: object
      required: [awaitingPayment, held, available, inFlight, paidThisWeek]
      properties:
        awaitingPayment:
          $ref: "#/components/schemas/Money"
        held:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
        inFlight:
          $ref: "#/components/schemas/Money"
        paidThisWeek:
          $ref: "#/components/schemas/Money"
    PayeeDetail:
      allOf:
        - $ref: "#/components/schemas/Payee"
        - type: object
          required: [earnings]
          properties:
            earnings:
              $ref: "#/components/schemas/PayeeEarnings"
    PayeePage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/Payee"
        nextCursor:
          type: string
    Payout:
      type: object
      description: One transfer of a payee's pooled earnings.
      required:
        - payoutId
        - payeeId
        - status
        - trigger
        - gross
        - fee
        - net
        - createdAt
      properties:
        payoutId:
          type: string
        payeeId:
          type: string
        status:
          type: string
          enum: [draft, submitting, pending, unknown, paid, failed, needs_review]
          description: unknown and needs_review mean APICenter is confirming the transfer with PayMongo; it is never sent twice.
        trigger:
          type: string
          enum: [schedule, release, cash_out]
        gross:
          $ref: "#/components/schemas/Money"
        fee:
          type: object
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
            currency:
              type: string
              enum: [PHP]
        net:
          $ref: "#/components/schemas/Money"
        failureCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PayoutPage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        nextCursor:
          type: string
    CheckoutCreateRequest:
      type: object
      required:
        - referenceId
        - amount
        - successUrl
        - cancelUrl
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AllocationInput"
          description: Payee shares of this payment, each at most the payment's amount in total. Each share is held when the payment is paid and paid out after you release it.
        referenceId:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: "#/components/schemas/Money"
        successUrl:
          type: string
          format: uri
          maxLength: 2048
          description: An HTTPS link, or your app's own link such as myapp://booking/123. APICenter forwards to an app link from an HTTPS page it hosts.
        cancelUrl:
          type: string
          format: uri
          maxLength: 2048
          description: An HTTPS link, or your app's own link. APICenter forwards to an app link from an HTTPS page it hosts.
        paymentMethods:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaymentMethod"
          description: Limits the checkout page to these methods. Each must be enabled for the environment (see getPaymentCapabilities). Defaults to card, gcash and paymaya.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Consumer-owned correlation metadata. Do not include secrets.
    PaymentIntentCreateRequest:
      type: object
      description: Send paymentMethod and returnUrl together to open that wallet directly; the response's nextAction.redirectUrl takes the customer straight to it. Leave both out for an intent you confirm yourself.
      required:
        - referenceId
        - amount
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AllocationInput"
          description: Payee shares of this payment, each at most the payment's amount in total. Each share is held when the payment is paid and paid out after you release it.
        referenceId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum:
            - gcash
            - paymaya
          description: The wallet to open. Requires returnUrl.
        returnUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where the wallet sends the customer afterwards, paid or not. An HTTPS link, or your app's own link; APICenter forwards to an app link from an HTTPS page it hosts. Requires paymentMethod.
        description:
          type: string
          maxLength: 255
        billing:
          type: object
          properties:
            name:
              type: string
              maxLength: 255
            email:
              type: string
              format: email
            phone:
              type: string
              maxLength: 32
      dependentRequired:
        paymentMethod:
          - returnUrl
        returnUrl:
          - paymentMethod
    ConfirmPaymentIntentRequest:
      type: object
      required:
        - paymentMethodId
        - clientKey
        - returnUrl
      properties:
        paymentMethodId:
          type: string
          minLength: 1
          description: Payment method ID created through the provider's client-side payment flow.
        clientKey:
          type: string
          minLength: 1
          description: Client key returned for this payment intent.
        returnUrl:
          type: string
          format: uri
          maxLength: 2048
    CustomerCreateRequest:
      type: object
      required:
        - customerReference
        - email
      properties:
        customerReference:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 255
    RefundCreateRequest:
      type: object
      required:
        - paymentId
        - amount
      properties:
        paymentId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
    SubscriptionCreateRequest:
      type: object
      required:
        - customerId
        - referenceId
        - priceId
      properties:
        customerId:
          type: string
        referenceId:
          type: string
        priceId:
          type: string
          description: APICenter-managed recurring price reference.
    Checkout:
      type: object
      required:
        - checkoutId
        - referenceId
        - status
        - amount
      properties:
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        checkoutId:
          type: string
        referenceId:
          type: string
        status:
          type: string
          enum:
            - created
            - pending
            - paid
            - failed
            - cancelled
            - expired
        amount:
          $ref: "#/components/schemas/Money"
        checkoutUrl:
          type: string
          format: uri
        aggregateVersion:
          type: integer
          minimum: 1
    PaymentIntent:
      type: object
      required:
        - paymentIntentId
        - referenceId
        - status
        - amount
      properties:
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        paymentIntentId:
          type: string
        referenceId:
          type: string
        status:
          type: string
          enum:
            - requires_action
            - pending
            - processing
            - succeeded
            - failed
            - cancelled
        amount:
          $ref: "#/components/schemas/Money"
        aggregateVersion:
          type: integer
          minimum: 1
        clientKey:
          type: string
          description: Short-lived client key for client-side operations on this payment intent; not a secret API key.
        nextAction:
          type: object
          properties:
            type:
              type: string
              enum: [ redirect ]
            redirectUrl:
              type: string
              format: uri
            returnUrl:
              type: string
              format: uri
        paymentMethod:
          type: string
          enum:
            - gcash
            - paymaya
          description: Set on a wallet payment intent.
        lastPaymentError:
          type: object
          description: Why the last payment attempt failed, when status is failed.
          properties:
            code:
              type: string
            message:
              type: string
    Customer:
      type: object
      required:
        - customerId
        - customerReference
      properties:
        customerId:
          type: string
        customerReference:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Refund:
      type: object
      required:
        - refundId
        - paymentId
        - status
        - amount
      properties:
        refundId:
          type: string
        paymentId:
          type: string
        status:
          type: string
          enum:
            - pending
            - processing
            - succeeded
            - failed
        amount:
          $ref: "#/components/schemas/Money"
    Subscription:
      type: object
      required:
        - subscriptionId
        - customerId
        - status
      properties:
        subscriptionId:
          type: string
        customerId:
          type: string
        status:
          type: string
          enum:
            - active
            - past_due
            - cancelled
            - pending
        currentPeriodEnd:
          type: string
          format: date-time
    Invoice:
      type: object
      required:
        - invoiceId
        - status
        - amount
      properties:
        invoiceId:
          type: string
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - past_due
            - void
        amount:
          $ref: "#/components/schemas/Money"
    PaymentMethod:
      type: string
      enum:
        - card
        - gcash
        - paymaya
        - qrph
    PaymentCapabilities:
      type: object
      required:
        - currency
        - paymentMethods
        - resources
      properties:
        currency:
          type: string
          enum:
            - PHP
        paymentMethods:
          type: array
          description: The methods enabled for this environment. Hide any method that is not listed.
          items:
            $ref: "#/components/schemas/PaymentMethod"
        resources:
          type: array
          items:
            type: string
    PaymentRecord:
      type: object
      required: [ type, id, projectId, environment, referenceId, relatedResourceId, amountMinor, currency, status, createdAt ]
      properties:
        type: { type: string }
        id: { type: string }
        projectId: { type: string }
        environment: { type: string, enum: [ test, live ] }
        referenceId: { type: [ string, 'null' ] }
        amountMinor: { type: [ string, 'null' ], pattern: '^-?[0-9]+$' }
        currency: { type: [ string, 'null' ] }
        status: { type: [ string, 'null' ] }
        createdAt: { type: string, format: date-time }
        relatedResourceId: { type: [ string, 'null' ] }
    PaymentRecordPage:
      type: object
      required: [ records ]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/PaymentRecord" }
        nextCursor: { type: string }
    PendingResource:
      type: object
      required:
        - status
        - resourceId
      properties:
        status:
          type: string
          enum:
            - pending
        resourceId:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        detail: {}
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          const: false
        error:
          $ref: "#/components/schemas/Error"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            correlationId:
              type: string
    PlanCreateRequest:
      type: object
      required:
        - name
        - amount
        - interval
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        amount:
          type: integer
          minimum: 2000
          description: Amount in PHP centavos.
        currency:
          type: string
          enum:
            - PHP
          default: PHP
        interval:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        cycleCount:
          type: integer
          minimum: 2
          description: Omit to bill indefinitely.
        metadata:
          type: object
          additionalProperties:
            type: string
    Plan:
      type: object
      required:
        - planId
        - name
        - amount
        - currency
        - interval
        - intervalCount
      properties:
        planId:
          type: string
        name:
          type: string
        description:
          type: string
        amount:
          type: integer
          description: Amount in PHP centavos.
        currency:
          type: string
          enum:
            - PHP
        interval:
          type: string
          enum:
            - weekly
            - monthly
            - yearly
        intervalCount:
          type: integer
        cycleCount:
          type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
    PaymentLinkCreateRequest:
      type: object
      required:
        - referenceId
        - amount
        - description
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AllocationInput"
          description: Payee shares of this payment, each at most the payment's amount in total. Each share is held when the payment is paid and paid out after you release it.
        referenceId:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          minLength: 1
          maxLength: 255
        remarks:
          type: string
          maxLength: 255
        metadata:
          type: object
          additionalProperties:
            type: string
          description: String values only. APICenter sets apicenter_reference_id to referenceId.
    PaymentLink:
      type: object
      required:
        - paymentLinkId
        - referenceId
        - amount
        - status
      properties:
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        paymentLinkId:
          type: string
        referenceId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          description: active or archived from PayMongo, or paid once PayMongo reports a payment for the link.
        active:
          type: boolean
