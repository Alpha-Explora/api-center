        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/intents/{paymentIntentId}/cancel:
    post:
      operationId: cancelPaymentIntent
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Payment intent cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PaymentIntent"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/customers:
    post:
      operationId: createCustomer
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Customer"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/v1/payments/customers/{customerId}:
    get:
      operationId: getCustomer
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Customer"
  /api/v1/payments/refunds:
    post:
      operationId: createRefund
      tags:
        - Payments
      parameters:
