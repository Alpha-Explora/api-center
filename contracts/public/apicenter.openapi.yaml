    OtpGenerateRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - sms
        recipient:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
          deprecated: true
          description: Legacy fallback when recipient is absent.
        purpose:
          type: string
          enum:
            - login
            - transaction
            - verification
          description: Accepted correlation purpose; does not change verification behavior.
        digits:
          type: number
          default: 6
          description: Requested length; runtime coerces numeric values and clamps the effective length to 4–10.
        ttlSeconds:
          type: number
          default: 300
          description: Requested lifetime; runtime clamps the effective lifetime to 60–3600 seconds.
      required:
        - channel
      anyOf:
        - required:
            - recipient
        - required:
            - target
