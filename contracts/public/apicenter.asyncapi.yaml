asyncapi: 3.1.0
info:
  title: APICenter Payment Events
  version: 2.0.0
  description: >-
    Payment lifecycle events. APICenter publishes each event to its Pub/Sub topic, filters it to the
    application that created the resource, and delivers it to that application's webhook as a signed
    HTTPS POST (Standard Webhooks: webhook-id, webhook-timestamp, webhook-signature).
defaultContentType: application/json
servers:
  test:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: APICenter test project Pub/Sub
  live:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: APICenter live project Pub/Sub
channels:
  "apicenter.payment-events.{environment}":
    address: apicenter.payment-events.{environment}
    description: Payment events, filtered per recipient application and delivered to its webhook.
    x-apicenter-consumer-filter:
      attribute: consumerServiceId
      source: control_plane.applications
    x-apicenter-webhook-delivery:
      signature: standard-webhooks-v1
      headers: [webhook-id, webhook-timestamp, webhook-signature]
      successStatus: 2xx
      deadLetterTopic: apicenter.payment-events.{environment}.dead-letter
      maxDeliveryAttempts: 20
    parameters:
      environment:
        description: APICenter environment.
        enum: [test, live]
    messages:
      PaymentCheckoutPaid:
        $ref: '#/components/messages/PaymentCheckoutPaid'
operations:
  receivePaymentEvent:
    action: receive
    channel:
      $ref: '#/channels/apicenter.payment-events.{environment}'
    messages:
      - $ref: '#/channels/apicenter.payment-events.{environment}/messages/PaymentCheckoutPaid'
components:
  messages:
    PaymentCheckoutPaid:
      name: payment.checkout.paid
      title: Checkout paid
      payload:
        allOf:
          - $ref: '#/components/schemas/PaymentEvent'
          - type: object
            properties:
              eventType: { type: string, const: payment.checkout.paid }
              aggregateType: { type: string, const: checkout }
              data: { $ref: '#/components/schemas/CheckoutPaid' }
  schemas:
    PaymentEvent:
      type: object
      required: [eventId, contractVersion, eventType, environment, organizationId, projectId, applicationId, referenceId, aggregateType, aggregateId, aggregateVersion, occurredAt, data]
      properties:
        eventId: { type: string, description: 'Stable across retries; deduplicate by it.' }
        contractVersion: { type: string, const: '2.0' }
        eventType: { type: string }
        environment: { type: string, enum: [test, live] }
        organizationId: { type: string }
        projectId: { type: string }
        applicationId: { type: string, description: 'The application whose call created the resource.' }
        referenceId: { type: string, description: 'The reference the application gave the resource.' }
        aggregateType: { type: string, enum: [checkout, payment_intent, refund, subscription, invoice] }
        aggregateId: { type: string }
        aggregateVersion: { type: integer, minimum: 1, description: 'Apply an event only when it is newer than the stored version.' }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        data: { type: object, additionalProperties: true }
    CheckoutPaid:
      type: object
      required: [status, checkoutId, paymentId, amount, currency]
      properties:
        status: { type: string, const: paid }
        checkoutId: { type: string }
        paymentId: { type: string }
        amount: { type: integer, minimum: 1, description: 'Minor units (centavos for PHP).' }
        currency: { type: string, minLength: 3, maxLength: 3 }
